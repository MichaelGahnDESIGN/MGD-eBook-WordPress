name: Prüfen
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: zip, dom, gd
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: find mgd-ebook -name '*.php' -exec php -l {} \;
      - run: node --check mgd-ebook/assets/ebook.js
      - run: node --check mgd-ebook/assets/ebook-admin.js
      - run: php tests/epub-parser.php
      - run: php tests/updater.php
      - run: php tests/install.php
      - run: php tests/catalog-feed.php
      - run: php tests/kit-wiring.php
      - run: php tests/cover-save.php
      - run: php tests/title-downloads.php
      - run: php tests/shelf.php
      - run: php tests/schema.php
      - run: node --check mgd-ebook/divi/assets/divi-vb.js
      - run: python3 scripts/check-docs.py
      - run: python3 scripts/build-package.py
